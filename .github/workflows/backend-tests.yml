name: Backend and ML tests

"on":
  pull_request:
  push:
    branches:
      - main
      - "Thai's-version"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: insider_test
          POSTGRES_USER: insider_test
          POSTGRES_PASSWORD: insider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U insider_test -d insider_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://insider_test:insider_test@localhost:5432/insider_test
      APP_ENV: test
      SAFE_UPDATE_MATERIALIZATION_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend suite, including PostgreSQL concurrency and migration tests
        run: python -m pytest
      - name: Lint backend
        run: python -m ruff check .

  machine-learning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: machine_learning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: machine_learning/pyproject.toml
      - name: Install ML and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run ML suite
        run: python -m pytest
      - name: Lint ML
        run: python -m ruff check .
